<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Aegis | Workspace</title>
  <link rel="icon" type="image/png" href="./aegis-mark.png">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./app.js"></script>
  <script defer src="./workspace-tools.js"></script>
  <script defer src="./session.js"></script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" aria-label="Workspace navigation">
      <a class="brand" href="#workspace">
        <img class="mark" src="./aegis-mark.png" alt="" width="34" height="34">
        <span>Aegis</span>
      </a>
      <nav id="navigation"></nav>
      <div class="sidebar-bottom">
        <button class="nav-button" id="settings-button" type="button" data-help-term="model-provider" aria-describedby="help-term-model-provider">Model Provider</button>
        <button class="nav-button" id="execution-button" type="button" data-help-term="execution" aria-describedby="help-term-execution">Execution</button>
        <button class="nav-button" id="extensions-button" type="button" data-help-term="toolbox" aria-describedby="help-term-toolbox">Skills & Tools</button>
        <button class="nav-button" id="dreaming-button" type="button" data-help-term="memory" aria-describedby="help-term-memory">Memory</button>
        <div class="engine" id="engine"><i></i><span>Checking Docker</span></div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <nav id="breadcrumbs" aria-label="Breadcrumb"></nav>
        <div class="topbar-tools">
          <span class="local">Local only</span>
        </div>
      </header>
      <main id="content" tabindex="-1"><p class="loading">Loading workspace…</p></main>
    </div>
  </div>
  <div id="lead-chat-root"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>Enable JavaScript to use Aegis.</noscript>
</body>
</html>
